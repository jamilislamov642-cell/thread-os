set default=0
set timeout=10

if loadfont /boot/grub/font.pf2; then
  set gfxmode=auto
  insmod efi_gop
  insmod efi_uga
  insmod gfxterm
  terminal_output gfxterm
fi

menuentry "Start THREAD OS" {
    set root=(hd0,gpt1)
    linux /vmlinuz root=/dev/sda2 ro quiet splash
    initrd /initrd.img
}

menuentry "Install THREAD OS" {
    set root=(hd0,gpt1)
    linux /vmlinuz root=/dev/sda2 ro quiet install
    initrd /initrd.img
}

menuentry "Safe Graphics Mode" {
    set root=(hd0,gpt1)
    linux /vmlinuz root=/dev/sda2 ro quiet nomodeset splash
    initrd /initrd.img
}

menuentry "Recovery Mode" {
    set root=(hd0,gpt1)
    linux /vmlinuz root=/dev/sda2 ro single
    initrd /initrd.img
}

menuentry "Memory Diagnostics" {
    set root=(hd0,gpt1)
    linux /vmlinuz root=/dev/sda2 ro memtest
    initrd /initrd.img
}
